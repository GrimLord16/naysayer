x-pipeline-env: &pipeline-env
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  REPO_OWNER: ${REPO_OWNER:-pytorch}
  REPO_NAME: ${REPO_NAME:-pytorch}
  MAX_ISSUES: ${MAX_ISSUES:-20000}
  TOP_N_LABELS: ${TOP_N_LABELS:-25}
  MIN_LABEL_COUNT: ${MIN_LABEL_COUNT:-20}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-naysayer}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # Direct client->MinIO artifact access (see mlflow service comment: proxied
  # artifact serving doesn't support HTTP Range requests, which MLflow's own
  # client needs for downloading large model files — so clients talk to MinIO
  # directly via boto3 instead of through the tracking server).
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MLflow's S3 artifact store expects the bucket to already exist — it won't
  # create it itself (unlike src/upload_to_storage.py, which ensures its own
  # bucket on every run).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      (mc mb -p local/${S3_BUCKET:-naysayer} || true) &&
      exit 0
      "

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    # --allowed-hosts matches the literal Host header exactly (port included), so
    # both bare and :5000 forms are needed: mlflow/mlflow:5000 for the in-network
    # name train.py connects to, localhost/localhost:5000 for host-machine access
    # (e.g. the browser UI).
    #
    # --default-artifact-root (direct client->S3), not --serve-artifacts (proxied
    # through this server): proxied artifact downloads don't support HTTP Range
    # requests, but the MLflow client uses ranged parallel downloads for large
    # files — every load_model() on a multi-MB model hung retrying forever. Direct
    # S3 access (real Range support) sidesteps it; clients get MinIO credentials
    # via the shared pipeline-env instead.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://${S3_BUCKET:-naysayer}/mlflow-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      # no curl in python:3.11-slim; urllib is already there
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      minio-init:
        condition: service_completed_successfully

  api:
    build: .
    # No local ./models mount anymore — it loads champion/challenger directly
    # from the MLflow registry at startup (see api/main.py).
    environment:
      <<: *pipeline-env
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    # Matches the host UID so writes to the bind-mounted ./data and ./models
    # directories don't fail with Permission denied (the image defaults to
    # UID 50000, which won't own files created by your host user).
    user: "${AIRFLOW_UID:-50000}:0"
    # `standalone` (not the multi-container setup) creates its own `admin` user with
    # a random password on first boot — it ignores _AIRFLOW_WWW_USER_USERNAME/PASSWORD.
    # Get the real password with: docker compose logs airflow | grep "Login with"
    command: standalone
    environment:
      <<: *pipeline-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  miniodata:
  mlflow_data:
